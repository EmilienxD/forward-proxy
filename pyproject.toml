[project]
name = "forward-proxy"
version = "0.1.0"
description = "HTTP proxy that logs requests and responses"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[project.scripts]
forward-proxy = "forward_proxy.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forward_proxy"]

[tool.hatch.build.targets.sdist]
include = ["src/forward_proxy"]
